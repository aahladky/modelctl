# Integration-repository CI.
#
# A thin wrapper around ci/checks.sh. The checks live in the script
# rather than here because a check that cannot be run by hand is a check
# nobody runs before pushing -- and because this file only executes when
# a runner exists, which for most of this project's life it did not.
#
# Runs on the `host` label (act_runner in host mode on this machine),
# not a container: the checks build llama.cpp, and the toolchain,
# ccache and warm build directories already live on the host. A
# container would download an image and rebuild from scratch every run,
# and could never reach the Arc cards when the SYCL matrix is added.
#
# The SYCL matrix still stays out of this on purpose: it needs the
# oneAPI toolchain and both cards free. CPU-only capability
# truthfulness is what must be enforced on every push, and that is what
# this does.

name: integration checks

on:
  push:
    branches: [master]
  pull_request:

jobs:
  checks:
    runs-on: host
    steps:
      # Plain git rather than actions/checkout: that action is JavaScript
      # fetched from github.com at run time, which is a strange
      # dependency for a runner sitting on the same box as the gitea it
      # builds for -- and it was the step that failed. This clones from
      # the local instance; .gitmodules uses a relative URL, so the
      # submodule resolves against the same host and inherits the
      # credential.
      - name: Checkout
        run: |
          set -euo pipefail
          # Plain git rather than actions/checkout: that action is
          # JavaScript fetched from github.com at run time, a strange
          # dependency for a runner sitting on the same box as the gitea
          # it builds for, and it makes the checks unrunnable offline.
          #
          # The repositories are private, so the fetch needs the
          # per-run token gitea provides. Fetch the REF rather than the
          # SHA: for pull_request events GITHUB_SHA names a merge commit
          # that is not always fetchable on its own.
          URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          if [ -n "${GITHUB_TOKEN:-}" ]; then
            URL="${GITHUB_SERVER_URL/:\/\//://x-access-token:${GITHUB_TOKEN}@}/${GITHUB_REPOSITORY}.git"
          else
            echo "note: no per-run token in the environment; a private" >&2
            echo "repository will fail to clone. Set a CI_TOKEN secret" >&2
            echo "and pass it as GITHUB_TOKEN if this fetch fails." >&2
          fi
          git init -q .
          git remote add origin "$URL" 2>/dev/null || git remote set-url origin "$URL"
          git fetch -q --depth 1 origin "${GITHUB_REF:-$GITHUB_SHA}" \
            || git fetch -q --depth 1 origin "$GITHUB_SHA"
          git checkout -q FETCH_HEAD
          # The submodule lives in a SIBLING repository, and gitea's
          # per-run token is scoped to this repository alone -- it gets
          # "Repository not found" for moe-serving/llama.cpp. The runner
          # runs as a user whose SSH key is already authorized on the
          # instance, so fetch the submodule over SSH instead of adding
          # a second stored credential.
          git config submodule.llama.cpp.url "git@gitea:moe-serving/llama.cpp.git"
          git -c protocol.version=2 submodule update --init --recursive --depth 1
        env:
          # secrets.GITHUB_TOKEN is gitea's automatic per-run token;
          # CI_TOKEN is the explicit fallback if the automatic one is
          # not provisioned on this instance.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN || secrets.CI_TOKEN }}

      - name: Install dependencies
        working-directory: modelctl
        run: |
          set -euo pipefail
          # uv, not python -m venv + pip: it is what the host has, and it
          # resolves the pinned requirements in seconds.
          uv venv .venv --python 3.14
          # requirements.txt is sufficient for the web tests: httpx,
          # which FastAPI's TestClient needs, arrives as a hard
          # dependency of huggingface-hub. A suite that silently skips
          # them reports a pass it has not earned.
          uv pip install --quiet -p .venv/bin/python -r requirements.txt pytest numpy

      - name: Run integration checks
        env:
          # Per-run build directories: the host runner may execute jobs
          # for several branches, and a shared cmake cache configured
          # against another checkout fails to configure.
          MODELCTL_CI_BUILD_DIR: ${{ github.workspace }}/.ci-build-cpu
          MODELCTL_CI_SAN_BUILD_DIR: ${{ github.workspace }}/.ci-build-san
        run: ./ci/checks.sh
