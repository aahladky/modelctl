<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}modelctl{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/htmx-2.0.4.min.js"></script>
</head>
<body>
<nav>
  <strong>modelctl</strong>
  <a href="/">dashboard</a>
  <a href="/add">add model</a>
  <a href="/runtime">runtime</a>
  <a href="/hardware">hardware</a>
  <a href="/tiers">tiers</a>
  <a href="/settings">settings</a>
  <a href="/setup">setup</a>
  <a href="/jobs">jobs</a>
  <span class="spacer"></span>
  <a href="/logout">logout</a>
</nav>
<main>
{% if setup_blocking %}
<div class="card">
  <p class="err"><strong>Setup incomplete —
    {{ setup_blocking | map(attribute='title') | join(', ') }}.</strong>
    <a href="/setup">fix it &rarr;</a></p>
</div>
{% endif %}
{% block content %}{% endblock %}
</main>
</body>
</html>
